[project]
name = "murdoku-solver"
version = "0.1.0"
description = "A typed, traceable Murdoku constraint solver"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "z3-solver>=4.13", "httpx>=0.27", "typer>=0.15"]

[project.scripts]
murdoku = "murdoku.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "pyright>=1.1.390"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests", "scripts"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/murdoku"]
